# Example: Senior Fullstack TypeScript Developer for a marketplace-analytics SaaS
#
# This profile is FULLY VISIBLE to the candidate at the start of the session.
# Weights and custom flags are set in front of the candidate during /eval-prepare,
# so they understand exactly what's being measured and why.
#
# Generated by /eval-prepare. Lives at:
#   <cwd>/.hr-eval/sessions/<session-id>/profile.yaml

position:
  title: "Senior Fullstack TypeScript Developer"
  level: "senior"
  stack: ["TypeScript", "Node.js", "React", "Postgres", "Redis"]
  domain: "B2B SaaS / marketplace analytics"

company:
  size: "small"
  context: |
    Small product team (5 engineers) building an analytics platform for marketplace sellers.
    Daily work mixes: integration with 3rd-party marketplace APIs (rate limits, flaky contracts),
    data pipelines, real-time dashboards, occasional debugging of legacy modules.
    Autonomy and judgment matter more than narrow specialization.

interview:
  format: "live"
  duration_min: 60
  ai_allowed: true

weights:
  promptcraft: 1.0
  critical_reception: 1.5   # small team can't afford blind AI acceptance in prod
  verification: 1.5         # we ship to production, observability owned by engineer
  debugging: 1.5            # legacy modules + flaky 3rd-party APIs = lots of debugging
  architecture: 1.0
  environment: 1.2          # small team, every engineer owns deploys + on-call
  metacognition: 1.0

critical:
  - category: "critical_reception"
    threshold: 1
    cap_overall_pct: 40
  - category: "verification"
    threshold: 1
    cap_overall_pct: 50

custom_green_flags:
  - signal: "asks AI to write a failing test before fix"
    category: "verification"
    weight_multiplier: 1.5
  - signal: "rejects unnecessary new dependency suggested by AI"
    category: "architecture"
    weight_multiplier: 1.5
  - signal: "verifies third-party API method exists in docs before using"
    category: "critical_reception"
    weight_multiplier: 2.0
  - signal: "uses grep/rg to locate existing util before generating new"
    category: "environment"
    weight_multiplier: 1.3

custom_red_flags:
  - signal: "imports a library AI suggested without checking it exists"
    category: "critical_reception"
    weight_multiplier: 2.0
  - signal: "adds Redux/Kafka/microservice for a trivial scope"
    category: "architecture"
    weight_multiplier: 1.5
  - signal: "loops AI 5+ times on the same error without new info"
    category: "debugging"
    weight_multiplier: 2.0

notes: |
  For this role we need someone who can be dropped into a flaky integration
  on day 2 and figure it out without senior hand-holding. Less worried about
  framework knowledge — more about how they think when AI gives confident-wrong answers.
