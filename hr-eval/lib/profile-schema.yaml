# Job Profile — SCHEMA DOCUMENTATION (not valid YAML)
#
# This file documents the structure expected by /eval-prepare and /eval-report.
# It uses TypeScript-style type annotations (`string`, `0..5`, `"junior" | "middle"`)
# and is NOT meant to be parsed as YAML. For a real, parseable example see:
#   templates/company-profile.example.yaml
#
# The profile is shared with everyone on the call. Candidate sees
# position/company/weights/flags before consenting and during work.
# Team lead reviews the same file when auditing the session log later.

profile:
  position:
    title: string                  # "Senior Fullstack Developer"
    level: "junior" | "middle" | "senior" | "lead"
    stack: [string]                # ["TypeScript", "React", "Node.js", "Postgres"]
    domain: string                 # "B2B SaaS for marketplaces"

  company:
    name: string                   # optional
    size: "solo" | "small" | "medium" | "enterprise"
    context: string                # 1-2 sentences about the product / team

  interview:
    format: "live"                 # this plugin is live-only
    duration_min: integer          # expected time for the task
    ai_allowed: true               # always true for hr-eval

  # Weights for the 7 cognition categories. Sum need not = 1; normalized in scoring.
  # Defaults to 1.0 each if /eval-prepare doesn't suggest changes.
  weights:
    promptcraft: float             # 0.0 .. 2.0 typical
    critical_reception: float
    verification: float
    debugging: float
    architecture: float
    environment: float
    metacognition: float

  # Critical categories: if score ≤ threshold, overall % is capped.
  critical:
    - category: "verification" | "critical_reception" | ...
      threshold: integer           # 0..5, typically 1 or 2
      cap_overall_pct: integer     # overall won't exceed this; default 40

  # Custom green / red flags tailored to this role. Added to base rubric.
  custom_green_flags:
    - signal: string               # "asks AI to write a failing test before fix"
      category: string             # one of the 7 categories
      weight_multiplier: float     # 1.0 default; 1.5+ if especially important

  custom_red_flags:
    - signal: string               # "imports a library AI suggested without checking"
      category: string
      weight_multiplier: float

  notes: string                    # free-form context (also visible to candidate)
